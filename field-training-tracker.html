<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Rebuild Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1F1A; --panel:#22261E; --panel2:#20241C; --border:#3A3F32;
    --text:#E8E4D8; --text2:#C9CBB8; --muted:#6B7060; --muted2:#9AA382; --muted3:#5C6152;
    --olive:#8A9A5B; --olive-dim:#8A9A5B18; --rust:#C1440E; --rust-dim:#C1440E22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; min-height:100vh;}
  .stencil{font-family:'Oswald',sans-serif; letter-spacing:.08em; text-transform:uppercase;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  .header{border-bottom:1px solid var(--border); background:var(--panel2); padding:24px 20px 16px;}
  .header-row{display:flex; align-items:center; justify-content:space-between;}
  .title{font-size:24px; font-weight:700; margin:2px 0 0; font-family:'Oswald',sans-serif;}
  .streak-badge{display:flex; align-items:center; gap:5px; padding:5px 10px; background:var(--rust-dim); border:1px solid var(--rust); color:var(--rust);}
  .tabs{display:flex; gap:4px; padding:16px 20px 0;}
  .tab{flex:none; display:flex; align-items:center; gap:6px; padding:8px 12px; font-size:12px; background:transparent; color:var(--muted2); border:1px solid var(--border);}
  .tab.active{background:var(--olive); color:var(--bg); border-color:var(--olive);}
  .content{padding:20px; padding-bottom:60px;}
  .gauge-row{display:flex; align-items:center; gap:16px; margin-bottom:24px;}
  .gauge-wrap{position:relative; width:110px; height:110px; display:flex; align-items:center; justify-content:center;}
  .gauge-pct{position:absolute; font-size:22px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .gauge-label{font-size:10px; margin-top:1px; color:var(--muted2);}
  .day-focus{font-size:18px; font-weight:600; margin-top:4px; font-family:'Oswald',sans-serif;}
  .day-sub{font-size:12px; color:var(--muted);}
  .exercise-card{background:var(--panel); border:1px solid var(--border); margin-bottom:8px;}
  .exercise-card.done{background:var(--olive-dim); border-color:var(--olive);}
  .exercise-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px;}
  .ex-main{flex:1; text-align:left; background:none; border:none; padding:0; color:inherit;}
  .ex-name{font-size:14px; font-weight:500;}
  .ex-meta{font-size:12px; color:var(--muted); margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .ex-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .form-btn{font-size:11px; padding:5px 8px; border:1px solid var(--muted3); color:var(--muted2); background:none;}
  .checkbox{width:24px; height:24px; display:flex; align-items:center; justify-content:center; border:1px solid var(--muted3); background:none; flex-shrink:0;}
  .checkbox.done{background:var(--olive); border-color:var(--olive);}
  .ex-detail{padding:0 16px 14px; border-top:1px solid var(--border);}
  .detail-label{font-size:10px; margin-top:12px; display:block;}
  .detail-list{margin:6px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px;}
  .detail-list li{font-size:12px; color:var(--text2); display:flex; gap:8px;}
  .num{color:var(--olive); font-family:'IBM Plex Mono',monospace; flex-shrink:0;}
  .dot{color:var(--rust); flex-shrink:0;}
  .rest-box{padding:36px 20px; text-align:center; border:1px dashed var(--border);}
  .rest-box .stencil{color:var(--muted2); font-size:14px;}
  .rest-box p{font-size:12px; color:var(--muted); margin-top:6px;}
  .action-row{display:flex; gap:8px; margin-top:24px;}
  .ghost-btn{flex:1; padding:12px; display:flex; align-items:center; justify-content:center; gap:8px; background:none; font-size:12px;}
  .ghost-olive{border:1px solid var(--olive); color:var(--olive);}
  .ghost-rust{border:1px solid var(--rust); color:var(--rust);}
  .week-day{border:1px solid var(--border); background:var(--panel); margin-bottom:8px;}
  .week-day.today{background:var(--olive-dim); border-color:var(--olive);}
  .week-day-row{width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:none; border:none; color:inherit; text-align:left;}
  .day-code{font-size:11px; color:var(--muted); width:32px; font-family:'IBM Plex Mono',monospace;}
  .week-day-name{font-size:14px; font-weight:500;}
  .week-day-focus{font-size:12px; color:var(--muted);}
  .chevron{transition:transform .15s; color:var(--muted3);}
  .chevron.open{transform:rotate(90deg);}
  .week-exercises{padding:0 16px 12px; border-top:1px solid var(--border);}
  .week-ex-row{padding:10px 0; border-bottom:1px solid #2A2E24;}
  .week-ex-row:last-child{border-bottom:none;}
  .week-ex-top{width:100%; display:flex; align-items:center; justify-content:space-between; background:none; border:none; color:inherit; text-align:left; padding:0;}
  .week-ex-name{font-size:12px; color:var(--text2);}
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;}
  .stat-card{padding:14px; background:var(--panel); border:1px solid var(--border);}
  .stat-val{font-size:20px; font-weight:700; margin-top:8px; font-family:'IBM Plex Mono',monospace;}
  .stat-label{font-size:10px; color:var(--muted); margin-top:2px; display:block;}
  .empty-note{padding:28px; text-align:center; font-size:12px; color:var(--muted); border:1px dashed var(--border);}
  .modal-overlay{position:fixed; inset:0; background:#00000099; display:flex; align-items:center; justify-content:center; padding:24px; z-index:50;}
  .modal-box{width:100%; max-width:380px; padding:20px; background:var(--panel2); border:1px solid var(--border);}
  .modal-head{display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:16px;}
  .modal-x{background:none; border:none; color:var(--muted);}
  .modal-input{width:100%; padding:10px 12px; margin-bottom:12px; background:var(--bg); border:1px solid var(--muted3); color:var(--text); outline:none; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .modal-save{width:100%; padding:10px; background:var(--olive); color:var(--bg); border:none; font-family:'Oswald',sans-serif; letter-spacing:.08em; font-size:13px;}
  .modal-hint{font-size:11px; color:var(--muted); margin:-6px 0 12px; line-height:1.5;}
  .modal-hint a{color:var(--olive);}
  .ex-image{width:100%; max-height:160px; object-fit:contain; background:var(--bg); border:1px solid var(--border); display:block;}
  .image-actions{display:flex; gap:8px; margin-top:6px;}
  .small-btn{font-size:11px; padding:5px 8px; background:none; display:flex; align-items:center; gap:4px;}
  .add-photo-btn{width:100%; padding:8px; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; background:none; border:1px dashed var(--muted3); color:var(--muted2);}
  svg{display:block;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Program library ----------
const PROGRAM = {
  MON: { name: "PUSH", focus: "Chest / Shoulders / Triceps", estMinutes: 35, exercises: [
    { name: "Push-ups", sets: 4, reps: "AMRAP", note: "or bench press if available" },
    { name: "Overhead Press", sets: 3, reps: "8-10" },
    { name: "Incline Push-ups / DB Press", sets: 3, reps: "10-12" },
    { name: "Tricep Dips", sets: 3, reps: "AMRAP" },
    { name: "Lateral Raises", sets: 3, reps: "12-15" },
  ]},
  TUE: { name: "PULL", focus: "Back / Biceps", estMinutes: 35, exercises: [
    { name: "Pull-ups / Assisted Pull-ups", sets: 4, reps: "AMRAP" },
    { name: "Bent-over Rows", sets: 3, reps: "8-10" },
    { name: "Inverted Rows", sets: 3, reps: "10-12" },
    { name: "Bicep Curls", sets: 3, reps: "12" },
    { name: "Face Pulls / Band Pull-aparts", sets: 3, reps: "15" },
  ]},
  WED: { name: "LEGS", focus: "Quads / Hams / Glutes", estMinutes: 40, exercises: [
    { name: "Bodyweight Squats / Back Squat", sets: 4, reps: "10-12" },
    { name: "Walking Lunges", sets: 3, reps: "12 per leg" },
    { name: "Romanian Deadlift", sets: 3, reps: "10" },
    { name: "Step-ups", sets: 3, reps: "12 per leg" },
    { name: "Calf Raises", sets: 4, reps: "15-20" },
  ]},
  THU: { name: "RUCK / CONDITIONING", focus: "Endurance + Core", estMinutes: 60, exercises: [
    { name: "Ruck March (weighted pack)", sets: 1, reps: "30-45 min" },
    { name: "Plank", sets: 3, reps: "45-60 sec" },
    { name: "Hanging Knee Raises", sets: 3, reps: "12-15" },
    { name: "Russian Twists", sets: 3, reps: "20" },
  ]},
  FRI: { name: "FULL BODY", focus: "Compound strength", estMinutes: 35, exercises: [
    { name: "Deadlift / Kettlebell Swings", sets: 4, reps: "6-8" },
    { name: "Goblet Squats", sets: 3, reps: "10" },
    { name: "Push Press", sets: 3, reps: "8" },
    { name: "Renegade Rows", sets: 3, reps: "10 per side" },
  ]},
  SAT: { name: "ACTIVE RECOVERY", focus: "Mobility + light cardio", estMinutes: 40, exercises: [
    { name: "Brisk Walk / Ruck (light)", sets: 1, reps: "20-30 min" },
    { name: "Mobility Flow", sets: 1, reps: "10 min" },
    { name: "Stretching", sets: 1, reps: "10 min" },
  ]},
  SUN: { name: "REST", focus: "Recovery — muscle is built here", estMinutes: 0, exercises: [] },
};
const DAY_KEYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

const FORM_GUIDE = {
  "Push-ups": { steps: ["Hands slightly wider than shoulders, body in a straight line", "Lower chest to just above the floor, elbows ~45° from body", "Push back up without locking elbows hard"], mistakes: ["Hips sagging or piking up", "Flaring elbows straight out to the sides"] },
  "Overhead Press": { steps: ["Feet shoulder-width, bar/DBs at shoulder height", "Brace core, press straight up without leaning back", "Lock out overhead, lower under control"], mistakes: ["Arching the lower back to press", "Pressing forward instead of straight up"] },
  "Incline Push-ups / DB Press": { steps: ["Hands on a raised surface (or bench for DB press)", "Lower under control, elbows ~45°", "Press back to start"], mistakes: ["Surface too low — turns into a regular push-up", "Rushing the lowering phase"] },
  "Tricep Dips": { steps: ["Hands on bench/chair behind you, legs extended", "Lower until elbows hit ~90°", "Press back up, keep shoulders down away from ears"], mistakes: ["Going too low and straining the shoulders", "Shrugging shoulders up toward ears"] },
  "Lateral Raises": { steps: ["Slight bend in elbows, weights at sides", "Raise to shoulder height, leading with elbows", "Lower slowly, don't swing"], mistakes: ["Using momentum/swinging the torso", "Raising above shoulder height"] },
  "Pull-ups / Assisted Pull-ups": { steps: ["Hands just outside shoulder width, full hang to start", "Pull chin over the bar, elbows drive down and back", "Lower fully under control"], mistakes: ["Only doing half reps", "Kipping/swinging instead of controlled pulling"] },
  "Bent-over Rows": { steps: ["Hinge at hips, back flat, slight knee bend", "Pull weight to lower ribs, elbows close to body", "Lower under control"], mistakes: ["Rounding the lower back", "Standing too upright — turns into a shrug"] },
  "Inverted Rows": { steps: ["Bar/rings at hip height, body straight underneath", "Pull chest to the bar, squeeze shoulder blades", "Lower with control"], mistakes: ["Hips sagging", "Not pulling all the way to the bar"] },
  "Bicep Curls": { steps: ["Elbows pinned to sides", "Curl up without swinging the shoulders", "Lower slowly, full extension at the bottom"], mistakes: ["Swinging the torso for momentum", "Only doing the top half of the rep"] },
  "Face Pulls / Band Pull-aparts": { steps: ["Pull band/rope toward your face, elbows high", "Squeeze shoulder blades together at the end", "Return slowly"], mistakes: ["Pulling low toward the chest instead of face height", "Using too much weight/band tension to control"] },
  "Bodyweight Squats / Back Squat": { steps: ["Feet shoulder-width, chest up", "Sit hips back and down, knees track over toes", "Drive up through the whole foot"], mistakes: ["Knees caving inward", "Heels lifting off the ground"] },
  "Walking Lunges": { steps: ["Step forward, lower until both knees ~90°", "Front knee stays over the ankle, not past toes", "Push through front heel to step into the next lunge"], mistakes: ["Front knee traveling too far past the toes", "Torso leaning forward"] },
  "Romanian Deadlift": { steps: ["Slight knee bend, hinge at the hips", "Lower weight along the legs, back flat", "Feel a stretch in the hamstrings, then drive hips forward to stand"], mistakes: ["Rounding the back", "Bending the knees too much — turns into a squat"] },
  "Step-ups": { steps: ["Full foot on the box/step", "Drive through that heel to stand up", "Control the step back down"], mistakes: ["Pushing off the trailing leg instead of the working leg", "Box too high, causing the knee to cave"] },
  "Calf Raises": { steps: ["Stand on flat ground or step edge", "Rise onto the balls of the feet", "Lower slowly past parallel for a full stretch"], mistakes: ["Bouncing instead of controlling the tempo", "Only doing a partial range of motion"] },
  "Ruck March (weighted pack)": { steps: ["Pack sits high and snug against the back", "Maintain upright posture, steady pace", "Take fixed rest stops rather than random pauses"], mistakes: ["Leaning forward under pack weight", "Starting with too much weight too soon"] },
  "Plank": { steps: ["Elbows under shoulders, forearms flat", "Body in one straight line from head to heels", "Squeeze glutes and brace core"], mistakes: ["Hips sagging low", "Hips piked too high"] },
  "Hanging Knee Raises": { steps: ["Hang from the bar, shoulders engaged", "Raise knees toward the chest using the core, not momentum", "Lower with control"], mistakes: ["Swinging the whole body to generate momentum", "Not controlling the lowering phase"] },
  "Russian Twists": { steps: ["Sit with knees bent, lean back slightly, chest up", "Rotate the torso side to side, tapping the ground", "Keep the movement controlled, not rushed"], mistakes: ["Rounding the lower back", "Moving only the arms instead of rotating the torso"] },
  "Deadlift / Kettlebell Swings": { steps: ["Hips back, flat back, weight close to shins", "Drive through the floor, hips and knees extend together", "Lock out standing tall, don't hyperextend"], mistakes: ["Rounding the back on the pull", "Jerking the weight off the floor"] },
  "Goblet Squats": { steps: ["Hold weight at chest, elbows pointing down", "Squat between the knees, chest stays tall", "Drive up through the whole foot"], mistakes: ["Elbows drifting out to the sides", "Heels rising off the floor"] },
  "Push Press": { steps: ["Slight knee dip, then drive up explosively", "Use leg drive to help press the weight overhead", "Lock out overhead, lower under control"], mistakes: ["Pressing with arms only, no leg drive", "Leaning back excessively at lockout"] },
  "Renegade Rows": { steps: ["Plank position, hands on dumbbells", "Row one weight to the hip while bracing the core", "Keep hips square, avoid rotating"], mistakes: ["Hips rotating with each row", "Feet too close together, causing instability"] },
  "Brisk Walk / Ruck (light)": { steps: ["Comfortable, sustainable pace", "Upright posture, relaxed shoulders", "Breathe steadily throughout"], mistakes: ["Going too fast — this is recovery, not conditioning", "Slouching forward"] },
  "Mobility Flow": { steps: ["Move each major joint through its full range", "Hold no position too rigidly — keep it flowing", "Focus on areas that felt tight this week"], mistakes: ["Rushing through positions", "Forcing a stretch into pain"] },
  "Stretching": { steps: ["Ease into each stretch gradually", "Hold 20-30 seconds per muscle group", "Breathe steadily, don't bounce"], mistakes: ["Bouncing in the stretch", "Stretching to the point of sharp pain"] },
};

function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dayCode(){ return DAY_KEYS[new Date().getDay()]; }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// ---------- Storage ----------
async function loadState(){
  try{
    const res = await window.storage.get("field-tracker-state");
    return res ? JSON.parse(res.value) : { logs:{}, bodyweight:[], startWeight:null, walks:[], images:{} };
  }catch{
    return { logs:{}, bodyweight:[], startWeight:null, walks:[], images:{} };
  }
}
async function saveState(state){
  try{ await window.storage.set("field-tracker-state", JSON.stringify(state)); }
  catch(e){ console.error("save failed", e); }
}

// ---------- App state ----------
let state = null;
let tab = "today";
let checked = {};
let expandedDay = null;
let expandedExercise = null;
let imageModalFor = null;

const app = document.getElementById("app");

async function init(){
  state = await loadState();
  const t = todayKey();
  checked = (state.logs[t] && state.logs[t].done) || {};
  render();
}

function persist(){ saveState(state); render(); }

function gaugeSvg(pct, label, sub){
  pct = Math.max(0, Math.min(100, pct));
  const circumference = 2*Math.PI*42;
  const offset = circumference - (pct/100)*circumference;
  return `
  <div class="gauge-wrap">
    <svg width="110" height="110" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#3A3F32" stroke-width="7"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#C1440E" stroke-width="7" stroke-linecap="butt"
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .6s ease"/>
    </svg>
    <div class="gauge-pct">${Math.round(pct)}%</div>
  </div>
  <div>
    <div class="stencil gauge-label" style="font-size:10px">${esc(label)}</div>
    ${sub ? `<div class="mono" style="font-size:10px;color:var(--muted3)">${esc(sub)}</div>` : ""}
  </div>`;
}

function computeStreak(){
  let count = 0;
  let d = new Date();
  while(true){
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const dc = DAY_KEYS[d.getDay()];
    const prog = PROGRAM[dc];
    if(prog.exercises.length === 0){ d.setDate(d.getDate()-1); continue; }
    const log = state.logs[key];
    const done = log && Object.values(log.done||{}).filter(Boolean).length >= prog.exercises.length;
    if(done){ count++; d.setDate(d.getDate()-1); } else break;
  }
  return count;
}

function render(){
  const dcode = dayCode();
  const program = PROGRAM[dcode];
  const tkey = todayKey();
  const totalEx = program.exercises.length;
  const doneCount = Object.values(checked).filter(Boolean).length;
  const dayPct = totalEx === 0 ? 100 : (doneCount/totalEx)*100;
  const streak = computeStreak();

  const walks = state.walks || [];
  const walksThisWeek = walks.filter(w => (new Date() - new Date(w.date))/(1000*60*60*24) <= 7);
  const weekDistance = walksThisWeek.reduce((s,w)=>s+(w.km||0),0);
  const todayWalk = walks.find(w => w.date === tkey);

  const bwSeries = state.bodyweight.slice(-14);
  const latestBw = bwSeries.length ? bwSeries[bwSeries.length-1].kg : null;
  const bwDelta = (latestBw!=null && state.startWeight!=null) ? (latestBw - state.startWeight).toFixed(1) : null;

  const workoutsThisWeek = (()=>{
    let n=0; const now=new Date();
    for(let i=0;i<7;i++){
      const d=new Date(now); d.setDate(now.getDate()-i);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const dc=DAY_KEYS[d.getDay()]; const prog=PROGRAM[dc];
      if(prog.exercises.length===0) continue;
      const log=state.logs[key];
      const done = log && Object.values(log.done||{}).filter(Boolean).length >= prog.exercises.length;
      if(done) n++;
    }
    return n;
  })();

  let html = `
  <div class="header">
    <div class="header-row">
      <div>
        <div class="stencil" style="font-size:11px;color:var(--olive)">Field Training Log</div>
        <div class="title">REBUILD PROTOCOL</div>
      </div>
      <div class="streak-badge">
        🔥<span class="mono" style="font-size:14px;font-weight:600">${streak}</span>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab ${tab==='today'?'active':''}" data-tab="today">TODAY</button>
    <button class="tab ${tab==='week'?'active':''}" data-tab="week">WEEK</button>
    <button class="tab ${tab==='progress'?'active':''}" data-tab="progress">PROGRESS</button>
  </div>
  <div class="content">`;

  if(tab === "today"){
    html += `
    <div class="gauge-row">
      ${gaugeSvg(dayPct, program.name, `${doneCount}/${totalEx||0}`)}
      <div>
        <div class="mono day-sub">${dcode} · ${new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div>
        <div class="day-focus">${esc(program.focus)}</div>
        ${program.estMinutes>0 ? `<div class="mono" style="font-size:11px;color:var(--muted3);margin-top:2px">~${program.estMinutes} min</div>` : ""}
        ${latestBw ? `<div class="mono" style="font-size:11px;color:var(--olive);margin-top:4px">Body weight: ${latestBw} kg ${bwDelta?`(${bwDelta>0?"+":""}${bwDelta} kg)`:""}</div>` : ""}
        ${todayWalk ? `<div class="mono" style="font-size:11px;color:var(--muted2);margin-top:2px">Walked: ${todayWalk.km} km${todayWalk.mins?` · ${todayWalk.mins} min`:""}</div>` : ""}
      </div>
    </div>`;

    if(program.exercises.length === 0){
      html += `<div class="rest-box"><div class="stencil">Rest Day</div><p>Recovery is when muscle rebuilds. No session logged today.</p></div>`;
    } else {
      program.exercises.forEach((ex, idx) => {
        const isDone = !!checked[idx];
        const guide = FORM_GUIDE[ex.name];
        const exKey = `today-${idx}`;
        const isOpen = expandedExercise === exKey;
        const img = state.images && state.images[ex.name];
        html += `
        <div class="exercise-card ${isDone?'done':''}">
          <div class="exercise-row">
            <button class="ex-main" data-toggle="${idx}">
              <div class="ex-name" style="${isDone?'color:var(--olive)':''}">${esc(ex.name)}</div>
              <div class="ex-meta">${ex.sets} × ${ex.reps}${ex.note?` · ${esc(ex.note)}`:""}</div>
            </button>
            <div class="ex-actions">
              ${guide ? `<button class="form-btn" data-formtoggle="${exKey}">${isOpen?"Hide":"Form"}</button>` : ""}
              <button class="checkbox ${isDone?'done':''}" data-toggle="${idx}">${isDone?"✓":""}</button>
            </div>
          </div>
          ${isOpen && guide ? `
          <div class="ex-detail">
            ${img ? `
              <img class="ex-image" src="${esc(img)}" alt="${esc(ex.name)}"/>
              <div class="image-actions">
                <button class="small-btn" style="border:1px solid var(--muted3);color:var(--muted2)" data-changeimg="${esc(ex.name)}">Change photo</button>
                <button class="small-btn" style="border:1px solid var(--muted3);color:var(--rust)" data-removeimg="${esc(ex.name)}">Remove</button>
              </div>` : `
              <button class="add-photo-btn" data-addimg="${esc(ex.name)}">📷 Add photo</button>`}
            <span class="stencil detail-label" style="color:var(--olive)">How to</span>
            <ol class="detail-list">
              ${guide.steps.map((s,si)=>`<li><span class="num">${si+1}.</span><span>${esc(s)}</span></li>`).join("")}
            </ol>
            <span class="stencil detail-label" style="color:var(--rust)">Avoid</span>
            <ul class="detail-list">
              ${guide.mistakes.map(m=>`<li><span class="dot">·</span><span>${esc(m)}</span></li>`).join("")}
            </ul>
          </div>` : ""}
        </div>`;
      });
    }

    html += `
    <div class="action-row">
      <button class="ghost-btn ghost-olive" data-open="walk">🥾 <span class="stencil" style="font-size:11px">Log Walk</span></button>
      <button class="ghost-btn ghost-rust" data-open="bw">+ <span class="stencil" style="font-size:11px">Body Weight</span></button>
    </div>`;
  }

  if(tab === "week"){
    html += `<div class="stencil" style="font-size:11px;color:var(--muted);margin-bottom:12px">This week · ${workoutsThisWeek} sessions completed</div>`;
    ["MON","TUE","WED","THU","FRI","SAT","SUN"].forEach(dc => {
      const prog = PROGRAM[dc];
      const isToday = dc === dcode;
      const isOpen = expandedDay === dc;
      html += `
      <div class="week-day ${isToday?'today':''}">
        <button class="week-day-row" data-daytoggle="${dc}">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="day-code">${dc}</span>
            <div>
              <div class="week-day-name">${prog.name}</div>
              <div class="week-day-focus">${esc(prog.focus)}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${prog.estMinutes>0 ? `<span class="mono" style="font-size:11px;color:var(--olive)">~${prog.estMinutes}m</span>` : ""}
            <span class="chevron ${isOpen?'open':''}">›</span>
          </div>
        </button>
        ${isOpen ? `
        <div class="week-exercises">
          ${prog.exercises.length===0 ? `<p style="font-size:11px;color:var(--muted);padding-top:10px">No exercises — recovery day.</p>` :
            prog.exercises.map((ex,i)=>{
              const exKey = `${dc}-${i}`;
              const guide = FORM_GUIDE[ex.name];
              const exOpen = expandedExercise === exKey;
              const img = state.images && state.images[ex.name];
              return `
              <div class="week-ex-row">
                <button class="week-ex-top" ${guide?`data-formtoggle="${exKey}"`:""}>
                  <span class="week-ex-name">${esc(ex.name)}</span>
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="mono" style="font-size:11px;color:var(--muted)">${ex.sets} × ${ex.reps}</span>
                    ${guide?`<span class="chevron ${exOpen?'open':''}" style="font-size:11px">›</span>`:""}
                  </div>
                </button>
                ${exOpen && guide ? `
                <div style="padding-bottom:10px">
                  ${img ? `
                    <img class="ex-image" style="margin-top:8px" src="${esc(img)}" alt="${esc(ex.name)}"/>
                    <div class="image-actions">
                      <button class="small-btn" style="border:1px solid var(--muted3);color:var(--muted2)" data-changeimg="${esc(ex.name)}">Change photo</button>
                      <button class="small-btn" style="border:1px solid var(--muted3);color:var(--rust)" data-removeimg="${esc(ex.name)}">Remove</button>
                    </div>` : `
                    <button class="add-photo-btn" data-addimg="${esc(ex.name)}">📷 Add photo</button>`}
                  <span class="stencil detail-label" style="color:var(--olive);margin-top:10px">How to</span>
                  <ol class="detail-list">
                    ${guide.steps.map((s,si)=>`<li><span class="num">${si+1}.</span><span>${esc(s)}</span></li>`).join("")}
                  </ol>
                  <span class="stencil detail-label" style="color:var(--rust)">Avoid</span>
                  <ul class="detail-list">
                    ${guide.mistakes.map(m=>`<li><span class="dot">·</span><span>${esc(m)}</span></li>`).join("")}
                  </ul>
                </div>` : ""}
              </div>`;
            }).join("")}
        </div>` : ""}
      </div>`;
    });
  }

  if(tab === "progress"){
    html += `
    <div class="stats-grid">
      <div class="stat-card">🪖<div class="stat-val">${Object.keys(state.logs).length}</div><span class="stencil stat-label">Total Sessions</span></div>
      <div class="stat-card">🔥<div class="stat-val">${streak}</div><span class="stencil stat-label">Day Streak</span></div>
      <div class="stat-card">🥾<div class="stat-val">${weekDistance.toFixed(1)}</div><span class="stencil stat-label">km Walked (7d)</span></div>
      <div class="stat-card">📈<div class="stat-val">${walksThisWeek.length}</div><span class="stencil stat-label">Walks (7d)</span></div>
    </div>
    <div class="stencil" style="font-size:11px;color:var(--muted);margin-bottom:8px">Body Weight Trend (kg)</div>`;

    if(bwSeries.length < 2){
      html += `<div class="empty-note">Log body weight on 2+ days to see a trend.</div>`;
    } else {
      const kgs = bwSeries.map(s=>s.kg);
      const min = Math.min(...kgs)-1, max = Math.max(...kgs)+1;
      const w=320,h=120,pad=20;
      const pts = bwSeries.map((s,i)=>{
        const x = pad + (i/(bwSeries.length-1))*(w-pad*2);
        const y = h-pad - ((s.kg-min)/(max-min))*(h-pad*2);
        return [x,y];
      });
      html += `
      <svg width="100%" viewBox="0 0 ${w} ${h}" style="background:var(--panel);border:1px solid var(--border)">
        <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#C1440E" stroke-width="2"/>
        ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="#E8E4D8"/>`).join("")}
      </svg>`;
    }

    html += `
    <button class="ghost-btn ghost-olive" style="width:100%;margin-top:24px" data-open="bw">+ <span class="stencil" style="font-size:11px">Log Body Weight</span></button>`;
  }

  html += `</div>`;

  // Modals
  if(imageModalFor){
    html += `
    <div class="modal-overlay" data-overlay="image">
      <div class="modal-box">
        <div class="modal-head">
          <span class="stencil" style="font-size:13px;color:var(--olive)">Add Photo — ${esc(imageModalFor)}</span>
          <button class="modal-x" data-close="image">✕</button>
        </div>
        <p class="modal-hint">Search for "${esc(imageModalFor.toLowerCase())} form" in Google Images, open the photo, copy its image address, and paste the link below.</p>
        <input class="modal-input" id="imgUrlInput" type="url" placeholder="Paste image URL" value="${esc(state.images && state.images[imageModalFor] || "")}"/>
        <button class="modal-save" data-saveimg="1">SAVE</button>
      </div>
    </div>`;
  }
  if(window.__showWalkModal){
    html += `
    <div class="modal-overlay" data-overlay="walk">
      <div class="modal-box">
        <div class="modal-head"><span class="stencil" style="font-size:13px;color:var(--olive)">Log Walk</span><button class="modal-x" data-close="walk">✕</button></div>
        <input class="modal-input" id="walkDistInput" type="number" inputmode="decimal" placeholder="Distance in km"/>
        <input class="modal-input" id="walkMinsInput" type="number" inputmode="decimal" placeholder="Duration in minutes (optional)"/>
        <button class="modal-save" data-savewalk="1">SAVE</button>
      </div>
    </div>`;
  }
  if(window.__showBwModal){
    html += `
    <div class="modal-overlay" data-overlay="bw">
      <div class="modal-box">
        <div class="modal-head"><span class="stencil" style="font-size:13px;color:var(--olive)">Log Body Weight</span><button class="modal-x" data-close="bw">✕</button></div>
        <input class="modal-input" id="bwInput" type="number" inputmode="decimal" placeholder="Weight in kg"/>
        <button class="modal-save" data-savebw="1">SAVE</button>
      </div>
    </div>`;
  }

  app.innerHTML = html;
  wireEvents();
}

function wireEvents(){
  app.querySelectorAll("[data-tab]").forEach(el=>{
    el.onclick = () => { tab = el.dataset.tab; expandedDay=null; expandedExercise=null; render(); };
  });
  app.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = () => {
      const idx = el.dataset.toggle;
      checked = { ...checked, [idx]: !checked[idx] };
      const tkey = todayKey();
      const program = PROGRAM[dayCode()];
      state.logs = { ...state.logs, [tkey]: { done: checked, dayName: program.name } };
      persist();
    };
  });
  app.querySelectorAll("[data-daytoggle]").forEach(el=>{
    el.onclick = () => { expandedDay = expandedDay===el.dataset.daytoggle ? null : el.dataset.daytoggle; render(); };
  });
  app.querySelectorAll("[data-formtoggle]").forEach(el=>{
    el.onclick = () => { expandedExercise = expandedExercise===el.dataset.formtoggle ? null : el.dataset.formtoggle; render(); };
  });
  app.querySelectorAll("[data-open]").forEach(el=>{
    el.onclick = () => {
      if(el.dataset.open==="walk") window.__showWalkModal = true;
      if(el.dataset.open==="bw") window.__showBwModal = true;
      render();
    };
  });
  app.querySelectorAll("[data-close]").forEach(el=>{
    el.onclick = () => {
      if(el.dataset.close==="walk") window.__showWalkModal = false;
      if(el.dataset.close==="bw") window.__showBwModal = false;
      if(el.dataset.close==="image") imageModalFor = null;
      render();
    };
  });
  app.querySelectorAll("[data-overlay]").forEach(el=>{
    el.addEventListener("click", (e) => { if(e.target === el) el.querySelector("[data-close]").click(); });
  });
  app.querySelectorAll("[data-addimg]").forEach(el=>{
    el.onclick = () => { imageModalFor = el.dataset.addimg; render(); };
  });
  app.querySelectorAll("[data-changeimg]").forEach(el=>{
    el.onclick = () => { imageModalFor = el.dataset.changeimg; render(); };
  });
  app.querySelectorAll("[data-removeimg]").forEach(el=>{
    el.onclick = () => {
      const name = el.dataset.removeimg;
      const images = { ...(state.images||{}) };
      delete images[name];
      state.images = images;
      persist();
    };
  });
  const saveImgBtn = app.querySelector("[data-saveimg]");
  if(saveImgBtn) saveImgBtn.onclick = () => {
    const val = document.getElementById("imgUrlInput").value.trim();
    if(!val) return;
    state.images = { ...(state.images||{}), [imageModalFor]: val };
    imageModalFor = null;
    persist();
  };
  const saveWalkBtn = app.querySelector("[data-savewalk]");
  if(saveWalkBtn) saveWalkBtn.onclick = () => {
    const km = parseFloat(document.getElementById("walkDistInput").value);
    const mins = parseFloat(document.getElementById("walkMinsInput").value);
    if(!km || km<=0) return;
    const tkey = todayKey();
    const entry = { date: tkey, km, mins: mins || null };
    state.walks = [...(state.walks||[]).filter(w=>w.date!==tkey), entry].sort((a,b)=>a.date.localeCompare(b.date));
    window.__showWalkModal = false;
    persist();
  };
  const saveBwBtn = app.querySelector("[data-savebw]");
  if(saveBwBtn) saveBwBtn.onclick = () => {
    const kg = parseFloat(document.getElementById("bwInput").value);
    if(!kg || kg<=0) return;
    const tkey = todayKey();
    const entry = { date: tkey, kg };
    state.bodyweight = [...state.bodyweight.filter(b=>b.date!==tkey), entry].sort((a,b)=>a.date.localeCompare(b.date));
    if(state.startWeight == null) state.startWeight = kg;
    window.__showBwModal = false;
    persist();
  };
}

init();
</script>
</body>
</html>
